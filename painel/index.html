<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Caio Faz 40</title>
<meta name="theme-color" content="#123330">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&display=swap">
<style>
:root{
  --nevoa:#E6EBE6;
  --papel:#F5F7F4;
  --branco:#FFFFFF;
  --petroleo:#123330;
  --texto:#111111;
  --texto-suave:#4D4D4D;
  --ipe:#F2BE2E;
  --ipe-claro:#FBEBC0;
  --linha:rgba(18,51,48,.16);
  --erro:#A3341F;
  --ok:#2F6B3A;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--nevoa);color:var(--texto);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:24px 16px 64px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 12px}
.sub{color:var(--texto-suave);margin:6px 0 0;font-size:14px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.caixa{background:var(--papel);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(18,51,48,.08)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:var(--branco);border-radius:16px;padding:16px;border:1px solid var(--linha)}
.card b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.card span{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--texto-suave)}
.card.destaque{background:var(--ipe-claro);border-color:transparent}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
button,.btn{font:700 15px/1 var(--body);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--petroleo);color:var(--papel)}
button.sec{background:transparent;color:var(--texto);border:1.5px solid var(--linha)}
button.perigo{background:transparent;color:var(--erro);border:1.5px solid rgba(163,52,31,.35)}
button:disabled{opacity:.6;cursor:default}
input[type=text],input[type=password],input[type=search]{width:100%;font:600 16px/1.3 var(--body);color:var(--texto);background:var(--branco);border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px}
input:focus{outline:none;border-color:var(--petroleo);box-shadow:0 0 0 4px var(--ipe-claro)}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.campo{margin-bottom:14px}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes label{letter-spacing:0;text-transform:none;font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:6px;background:var(--branco);border:1.5px solid var(--linha);border-radius:999px;padding:8px 14px;cursor:pointer}
.opcoes input{accent-color:var(--petroleo)}
.ferramentas{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ferramentas input{flex:1;min-width:180px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{padding:8px 14px;font-size:14px}
.filtros button[aria-pressed=false]{background:transparent;color:var(--texto);border:1.5px solid var(--linha)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-suave);padding:8px 10px;border-bottom:1.5px solid var(--linha)}
td{padding:12px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
td.acoes{text-align:right;white-space:nowrap}
td.acoes button{padding:8px 12px;font-size:13px;margin-left:4px}
.selo{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.selo.sim{background:#DCEFE0;color:var(--ok)}
.selo.nao{background:#F6DED8;color:var(--erro)}
.quando{color:var(--texto-suave);font-size:13px}
.vazio{text-align:center;color:var(--texto-suave);padding:28px 0}
@media (max-width:640px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border-bottom:1px solid var(--linha);padding:10px 0}
  td{border:0;padding:3px 0}
  td.acoes{text-align:left;padding-top:8px}
  td.acoes button{margin:0 6px 0 0}
}
.erro{color:var(--erro);font-weight:700;font-size:14px;margin:8px 0 0}
dialog{border:0;border-radius:20px;padding:22px;width:min(440px,calc(100% - 32px));background:var(--papel);color:var(--texto)}
dialog::backdrop{background:rgba(17,17,17,.45)}
.aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--texto);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>


  <section id="telaPainel">
    <div class="topo">
      <div>
        <h1>Caio Faz 40 · Convidados</h1>
        <p class="sub" id="atualizado">Carregando…</p>
      </div>
      <div class="linha-botoes">
        <button type="button" id="btnNovo">+ Adicionar convidado</button>
        <button type="button" class="sec" id="btnExportar">Exportar para Excel</button>
        <button type="button" class="sec" id="btnAtualizar">Atualizar</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><b id="kResponderam">0</b><span>Responderam</span></div>
      <div class="card"><b id="kConfirmadas">0</b><span>Presenças confirmadas</span></div>
      <div class="card destaque"><b id="kPessoas">0</b><span>Pessoas (com acompanhantes)</span></div>
      <div class="card"><b id="kAusencias">0</b><span>Ausências</span></div>
    </div>

    <div class="caixa">
      <h2>Lista de convidados</h2>
      <div class="ferramentas">
        <input type="search" id="busca" placeholder="Buscar por nome" aria-label="Buscar por nome">
        <div class="filtros" role="group" aria-label="Filtrar">
          <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
          <button type="button" data-filtro="sim" aria-pressed="false">Vão</button>
          <button type="button" data-filtro="nao" aria-pressed="false">Não vão</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Convidado</th><th>Acompanhante</th><th>Status</th><th>Respondeu em</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
      <p class="vazio" id="vazio" hidden>Ninguém por aqui ainda.</p>
    </div>
  </section>

</main>

<dialog id="dlg">
  <form id="fEditar" method="dialog">
    <h2 id="dlgTitulo">Editar convidado</h2>
    <div class="campo">
      <label for="eNome">Nome</label>
      <input type="text" id="eNome" maxlength="80" required>
    </div>
    <div class="campo">
      <label>Vai?</label>
      <div class="opcoes">
        <label><input type="radio" name="eStatus" value="sim"> Vai</label>
        <label><input type="radio" name="eStatus" value="nao"> Não vai</label>
      </div>
    </div>
    <div class="campo" id="eAcompCampo">
      <label for="eAcomp">Acompanhante (deixe vazio se vem sozinho)</label>
      <input type="text" id="eAcomp" maxlength="80">
    </div>
    <p class="erro" id="erroEditar" hidden></p>
    <div class="linha-botoes" style="margin-top:8px">
      <button type="submit" id="btnSalvar" value="salvar">Salvar</button>
      <button type="button" class="sec" id="btnCancelar">Cancelar</button>
    </div>
  </form>
</dialog>

<div class="aviso" id="aviso" role="status" hidden></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var convidados = [], filtro = "todos", editando = null;

  function escapa(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var fmt = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

  function api(metodo, query, corpo){
    return fetch("/api/convidados" + (query || ""), {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: corpo ? JSON.stringify(corpo) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (!r.ok) throw new Error(j.erro || "Algo deu errado.");
        return j;
      });
    });
  }

  function aviso(msg){ var a = $("aviso"); a.textContent = msg; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(function(){ a.hidden = true; }, 2600); }

  function carregar(){
    $("atualizado").textContent = "Carregando…";
    return api("GET").then(function(j){
      convidados = j.convidados || [];
      desenhar();
      $("atualizado").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    });
  }

  function desenhar(){
    var vao = convidados.filter(function(c){ return c.vai; });
    $("kResponderam").textContent = convidados.length;
    $("kConfirmadas").textContent = vao.length;
    $("kPessoas").textContent = vao.reduce(function(s, c){ return s + c.quantidade; }, 0);
    $("kAusencias").textContent = convidados.length - vao.length;

    var termo = $("busca").value.trim().toLowerCase();
    var visiveis = convidados.filter(function(c){
      if (filtro === "sim" && !c.vai) return false;
      if (filtro === "nao" && c.vai) return false;
      return !termo || c.nome.toLowerCase().indexOf(termo) !== -1 || (c.acompanhante || "").toLowerCase().indexOf(termo) !== -1;
    });
    $("lista").innerHTML = visiveis.map(function(c){
      return "<tr>" +
        "<td><b>" + escapa(c.nome) + "</b></td>" +
        "<td>" + (c.acompanhante ? escapa(c.acompanhante) : "<span class='quando'>—</span>") + "</td>" +
        "<td><span class='selo " + (c.vai ? "sim'>Vai" + (c.quantidade === 2 ? " (2)" : "") : "nao'>Não vai") + "</span></td>" +
        "<td class='quando'>" + escapa(fmt.format(new Date(c.criado_em))) + "</td>" +
        "<td class='acoes'><button type='button' class='sec' data-editar='" + c.id + "'>Editar</button>" +
        "<button type='button' class='perigo' data-remover='" + c.id + "'>Remover</button></td>" +
      "</tr>";
    }).join("");
    $("vazio").hidden = visiveis.length > 0;
  }



  // Exportar: gera um .xlsx de verdade (abas Convidados e Resumo) com a SheetJS,
  // carregada só quando o botão é usado.
  function carregaXLSX(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function(ok, falha){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = function(){ ok(window.XLSX); };
      s.onerror = function(){ falha(new Error("Não foi possível gerar o arquivo agora.")); };
      document.head.appendChild(s);
    });
  }
  var fmtCompleto = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  $("btnExportar").addEventListener("click", function(){
    var b = $("btnExportar"); b.disabled = true;
    carregaXLSX().then(function(XLSX){
      var ordem = convidados.slice().sort(function(a, c){ return a.criado_em < c.criado_em ? -1 : 1; });
      var acumulado = 0;
      var linhas = [["Data e hora", "Nome", "Status", "Participantes", "Acompanhante", "Total de pessoas confirmadas"]];
      ordem.forEach(function(c){
        acumulado += c.quantidade;
        linhas.push([fmtCompleto.format(new Date(c.criado_em)).replace(",", ""), c.nome, c.vai ? "Confirmado" : "Não vai", c.quantidade, c.acompanhante || "", acumulado]);
      });
      var vao = convidados.filter(function(c){ return c.vai; });
      var resumo = [
        ["Indicador", "Total"],
        ["Convidados que responderam", convidados.length],
        ["Presenças confirmadas", vao.length],
        ["Pessoas confirmadas (com acompanhantes)", acumulado],
        ["Ausências", convidados.length - vao.length],
        [],
        ["Lista nominal de participantes", ""]
      ];
      vao.slice().sort(function(a, c){ return a.nome.localeCompare(c.nome, "pt-BR"); }).forEach(function(c){
        resumo.push([c.nome, ""]);
        if (c.acompanhante) resumo.push([c.acompanhante + " (acompanhante de " + c.nome + ")", ""]);
      });
      var wb = XLSX.utils.book_new();
      var ws1 = XLSX.utils.aoa_to_sheet(linhas);
      ws1["!cols"] = [{ wch: 18 }, { wch: 32 }, { wch: 12 }, { wch: 13 }, { wch: 32 }, { wch: 14 }];
      var ws2 = XLSX.utils.aoa_to_sheet(resumo);
      ws2["!cols"] = [{ wch: 48 }, { wch: 8 }];
      XLSX.utils.book_append_sheet(wb, ws1, "Convidados");
      XLSX.utils.book_append_sheet(wb, ws2, "Resumo");
      var hoje = new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
      XLSX.writeFile(wb, "caio-faz-40-convidados-" + hoje + ".xlsx");
    }).catch(function(err){ aviso(err.message); })
      .then(function(){ b.disabled = false; });
  });

  $("btnAtualizar").addEventListener("click", function(){ carregar().catch(function(err){ aviso(err.message); }); });
  $("busca").addEventListener("input", desenhar);
  Array.prototype.forEach.call(document.querySelectorAll("[data-filtro]"), function(b){
    b.addEventListener("click", function(){
      filtro = b.getAttribute("data-filtro");
      Array.prototype.forEach.call(document.querySelectorAll("[data-filtro]"), function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      desenhar();
    });
  });

  function statusEdicao(){ var r = document.querySelector("input[name=eStatus]:checked"); return r ? r.value : ""; }
  function ajustaAcomp(){ $("eAcompCampo").hidden = statusEdicao() !== "sim"; }
  Array.prototype.forEach.call(document.querySelectorAll("input[name=eStatus]"), function(r){ r.addEventListener("change", ajustaAcomp); });

  function abrir(c){
    editando = c;
    $("dlgTitulo").textContent = c ? "Editar convidado" : "Adicionar convidado";
    $("eNome").value = c ? c.nome : "";
    $("eAcomp").value = c && c.acompanhante ? c.acompanhante : "";
    Array.prototype.forEach.call(document.querySelectorAll("input[name=eStatus]"), function(r){
      r.checked = c ? (r.value === (c.vai ? "sim" : "nao")) : r.value === "sim";
    });
    ajustaAcomp();
    $("erroEditar").hidden = true;
    $("dlg").showModal();
    $("eNome").focus();
  }

  $("btnNovo").addEventListener("click", function(){ abrir(null); });
  $("btnCancelar").addEventListener("click", function(){ $("dlg").close(); });

  $("lista").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    var id = Number(b.getAttribute("data-editar") || b.getAttribute("data-remover"));
    var c = convidados.filter(function(x){ return x.id === id; })[0]; if (!c) return;
    if (b.hasAttribute("data-editar")) return abrir(c);
    if (!confirm("Remover " + c.nome + " da lista?")) return;
    api("DELETE", "?id=" + id).then(function(){ aviso(c.nome + " removido."); return carregar(); })
      .catch(function(err){ aviso(err.message); });
  });

  $("fEditar").addEventListener("submit", function(e){
    e.preventDefault();
    var st = statusEdicao(), acomp = $("eAcomp").value.trim();
    var corpo = { nome: $("eNome").value, status: st, quantidade: st === "sim" ? (acomp ? 2 : 1) : 0, acompanhante: acomp };
    $("btnSalvar").disabled = true;
    var p = editando ? api("PATCH", "?id=" + editando.id, corpo) : api("POST", "", corpo);
    p.then(function(){ $("dlg").close(); aviso("Salvo."); return carregar(); })
      .catch(function(err){ $("erroEditar").textContent = err.message; $("erroEditar").hidden = false; })
      .then(function(){ $("btnSalvar").disabled = false; });
  });

  carregar().catch(function(err){ $("atualizado").textContent = err.message; });
  setInterval(function(){ if (!$("dlg").open) carregar().catch(function(){}); }, 60000);
})();
</script>
</body>
</html>
